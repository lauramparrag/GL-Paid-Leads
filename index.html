<style>

/* ── TRANSPERFECT 2026 BRAND TOKENS ── */
:root {
  --blue-primary: #003FC7;
  --blue-dark:    #03002C;
  --blue-mid:     #002673;
  --blue-light:   #4D88FF;
  --blue-pale:    #D2E6FA;
  --blue-wash:    #F0F4FA;
  --teal:   #3BBFB5;
  --purple: #6531CC;
  --orange: #FA6419;
  --green:  #3EB236;
  --pink:   #ec388a;
  --text:   #03002C;
  --muted:  #5A6A8A;
  --border: #D2E6FA;
  --surface: #F0F4FA;
  --white:  #ffffff;
  --shadow: 0 2px 16px rgba(0,63,199,0.08);
  --shadow-hover: 0 6px 28px rgba(0,63,199,0.14);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Geist','Inter',sans-serif;background:var(--blue-wash);color:var(--text);min-height:100vh;}

/* ── HEADER ── */
.site-header{background:#03002C;padding:44px 60px 40px;position:relative;overflow:hidden;}
.site-header::before{content:"";position:absolute;left:-120px;top:-140px;width:580px;height:580px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%, rgba(140,90,255,.55) 0%, rgba(100,60,220,.3) 40%, transparent 72%);pointer-events:none;}
.site-header::after{content:"";position:absolute;right:-80px;bottom:-80px;width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle at 60% 60%, rgba(161,251,249,.45) 0%, rgba(59,191,181,.2) 50%, transparent 72%);pointer-events:none;}
.orb-mid{position:absolute;right:28%;top:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle, rgba(77,136,255,.35) 0%, transparent 70%);pointer-events:none;}
.header-inner{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:20px;position:relative;z-index:2;}
.header-badge{display:inline-block;background:rgba(161,251,249,.12);border:1px solid rgba(161,251,249,.3);color:#A1FBF9;font-size:10px;font-weight:600;letter-spacing:2.5px;text-transform:uppercase;padding:4px 14px;border-radius:20px;margin-bottom:14px;}
.header-title{font-size:36px;font-weight:800;color:#fff;line-height:1.08;letter-spacing:-0.5px;}
.header-title em{font-style:normal;color:#A1FBF9;}
.header-sub{color:rgba(255,255,255,.45);font-size:13px;margin-top:6px;font-weight:300;}
.header-stats{display:flex;gap:32px;margin-top:24px;flex-wrap:wrap;}
.hstat{border-left:2px solid rgba(161,251,249,.35);padding-left:14px;}
.hstat-num{font-size:24px;font-weight:800;color:#fff;}
.hstat-label{font-size:10px;color:rgba(255,255,255,.45);letter-spacing:.5px;}
.header-btns{display:flex;gap:8px;align-items:center;position:relative;z-index:2;}
.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1.5px solid rgba(255,255,255,.25);border-radius:8px;padding:8px 18px;font-size:12px;font-weight:500;cursor:pointer;font-family:'Geist','Inter',sans-serif;transition:all .2s;}
.btn-ghost:hover{background:rgba(255,255,255,.2);}

/* ── NAV ── */
.nav-bar{display:flex;gap:4px;background:#fff;padding:10px 60px;border-bottom:1px solid var(--border);overflow-x:auto;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(0,63,199,.07);}
.nav-tab{padding:9px 22px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--muted);background:transparent;border:none;transition:all .18s;font-family:'Geist','Inter',sans-serif;display:flex;align-items:center;gap:7px;}
.nav-tab:hover{background:var(--blue-wash);color:var(--blue-primary);}
.nav-tab.active{background:var(--blue-dark);color:#fff;}

/* ── SECTIONS ── */
.section{padding:40px 60px 60px;display:none;}
.section.active{display:block;}
.sec-eyebrow{font-size:10px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--blue-light);margin-bottom:6px;}
.sec-title{font-size:28px;font-weight:800;color:var(--blue-dark);margin-bottom:6px;}
.sec-desc{color:var(--muted);font-size:14px;max-width:720px;margin-bottom:24px;line-height:1.7;font-weight:300;}
.section-label{font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--blue-primary);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--border);margin-top:4px;}

/* ── FILTER BAR ── */
.filter-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:20px;background:#fff;border:1.5px solid var(--border);border-radius:12px;padding:14px 20px;box-shadow:var(--shadow);}
.search-input{border:1.5px solid var(--border);border-radius:8px;padding:6px 12px;font-size:12px;font-family:'Geist','Inter',sans-serif;color:var(--text);background:var(--white);min-width:220px;flex:1 1 220px;outline:none;transition:border .18s;}
.search-input:focus{border-color:var(--blue-primary);}
.fdivider{width:1px;height:22px;background:var(--border);margin:0 8px;}
.custom-select{position:relative;user-select:none;}
.custom-select-trigger{display:flex;align-items:center;gap:8px;border:1.5px solid var(--border);border-radius:8px;padding:5px 12px;font-size:11px;font-weight:500;color:var(--muted);background:var(--white);cursor:pointer;font-family:'Geist','Inter',sans-serif;transition:all .18s;white-space:nowrap;}
.custom-select-trigger:hover{border-color:var(--blue-primary);color:var(--blue-primary);}
.custom-select.open .custom-select-trigger{border-color:var(--blue-primary);color:var(--blue-primary);}
.custom-select.open .cs-chevron{transform:rotate(180deg);}
.cs-chevron{transition:transform .2s;flex-shrink:0;color:inherit;}
.custom-select-menu{display:none;position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1.5px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(0,63,199,.12);z-index:999;min-width:210px;max-height:320px;overflow-y:auto;padding:4px;}
.custom-select.open .custom-select-menu{display:block;}
.custom-select-option{padding:8px 12px;font-size:11px;font-weight:500;color:var(--muted);cursor:pointer;border-radius:7px;transition:all .15s;font-family:'Geist','Inter',sans-serif;white-space:nowrap;}
.custom-select-option:hover{background:var(--blue-wash);color:var(--blue-primary);}
.custom-select-option.selected{background:var(--blue-wash);color:var(--blue-primary);font-weight:700;}
.custom-select-option.sub{padding-left:24px;font-weight:400;}
.custom-select-option.group{font-weight:700;color:var(--blue-dark);}
.filter-count{margin-left:auto;font-size:11px;color:#a0b4c8;white-space:nowrap;}

/* ── STAT HERO (dynamic big number) ── */
.stat-hero{display:flex;align-items:center;gap:20px;background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:22px 26px;margin-bottom:20px;box-shadow:var(--shadow);border-left:4px solid var(--blue-primary);}
.stat-hero-value{font-size:44px;font-weight:800;color:var(--blue-dark);line-height:1;white-space:nowrap;}
.stat-hero-label{font-size:13px;color:var(--muted);font-weight:500;}
.stat-hero-label b{color:var(--blue-primary);}

/* ── KPI CARDS ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:14px;margin-bottom:28px;}
.kpi-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:20px 22px;position:relative;overflow:hidden;box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s,transform .08s;cursor:pointer;}
.kpi-card:hover{box-shadow:var(--shadow-hover);border-color:var(--blue-primary);transform:translateY(-1px);}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;border-radius:14px 14px 0 0;}
.kpi-b::before{background:var(--blue-primary);} .kpi-b .kpi-value{color:var(--blue-primary);}
.kpi-d::before{background:var(--blue-dark);}
.kpi-t::before{background:var(--teal);} .kpi-t .kpi-value{color:var(--teal);}
.kpi-o::before{background:var(--orange);} .kpi-o .kpi-value{color:var(--orange);}
.fn-table .table-card{max-height:none;overflow-x:auto;} .fn-table th:nth-child(n+3){text-align:right;} .fn-table td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;} .fn-table tr.fn-group td{background:#f4f8fd;font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#6b8cae;} .fn-table tr.fn-total td{font-weight:800;border-top:2px solid var(--border);} .fn-note{font-size:12px;color:var(--muted);line-height:1.6;margin:18px 2px 0;} .fn-note b{color:var(--blue-dark);}
.kpi-l::before{background:#00838F;} .kpi-l .kpi-value{color:#00838F;}
.kpi-m::before{background:#0866FF;} .kpi-m .kpi-value{color:#0866FF;}
.kpi-g::before{background:#1F7A2E;} .kpi-g .kpi-value{color:#1F7A2E;}
.kpi-p::before{background:var(--purple);} .kpi-p .kpi-value{color:var(--purple);}
.kpi-label{font-size:9px;font-weight:700;color:#a0b4c8;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px;}

.kpi-sub{font-size:11px;color:#a0b4c8;margin-top:6px;}

/* ── CHART CARDS ── */
.chart-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
.chart-card{background:#fff;border:1.5px solid var(--border);border-radius:14px;padding:20px 18px 14px;box-shadow:var(--shadow);transition:border-color .2s;}

.chart-wrap{background:var(--blue-wash);border-radius:8px;padding:10px 6px 6px;}
.clabel{display:flex;align-items:center;gap:10px;margin-bottom:12px;}

/* ── TABLE ── */

td{padding:9px 12px;vertical-align:top;}

.cell-sub{color:#a0b4c8;font-size:10.5px;}

.badge-neutral{background:var(--blue-wash);color:var(--muted);}
.empty-row td{text-align:center;padding:40px 20px;color:#a0b4c8;font-size:12px;}
a.ext-link{color:var(--blue-primary);text-decoration:none;font-size:10.5px;}

.footer{text-align:center;color:#a0b4c8;font-size:10px;letter-spacing:1.5px;padding:24px 0 8px;font-weight:500;text-transform:uppercase;}

@media(max-width:820px){

}
/* ── SUB-TABS (LinkedIn / Meta) ── */
.subnav{display:flex;gap:6px;margin:0 0 22px;border-bottom:2px solid var(--border);}
.subtab{background:transparent;border:none;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 18px;font-family:'Geist','Inter',sans-serif;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;transition:all .15s;}

.nu-table td.n,.nu-table th:nth-child(n+2){text-align:right;} .nu-table td.n{font-variant-numeric:tabular-nums;white-space:nowrap;}
.nu-table .table-card{max-height:none;overflow-x:auto;}

/* ── CREATIVES ── */

.cr-tag{font-size:9px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--blue-light);}

.cr-comment{font-size:12.5px;color:var(--muted);line-height:1.6;}

/* ═════════ TRANSPERFECT 2026 BRAND LAYER ═════════
   Geist Sans · Blue 500 #003FC7 · Blue 800 #03002C · Aqua #A1FBF9 · Lavender #C2A3FF · Blue White #E0E8F5
   Brand visuals are built from gradients only (guideline: "created through gradients, not by applying assets"). */
:root{
  --blue-wash:#F3F6FC; --surface:#F3F6FC; --border:#E0E8F5; --blue-pale:#E0E8F5; --muted:#5A6A8A;
  --lav:#C2A3FF; --lav-wash:#F5F0FF; --aqua:#A1FBF9;
  --shadow:0 1px 2px rgba(3,0,44,.04),0 4px 18px rgba(3,0,44,.04);
  --shadow-hover:0 2px 4px rgba(3,0,44,.06),0 10px 30px rgba(0,63,199,.12);
  --streaks:
    linear-gradient(180deg,#03002C 0%,rgba(3,0,44,.55) 38%,rgba(3,0,44,0) 78%),
    repeating-linear-gradient(90deg,#05003A 0,#0B1FA6 34px,#4B38E0 62px,#7A5BF0 76px,#2A2BB8 100px,#05003A 132px);
}
body{font-family:'Geist','Inter',sans-serif;background:linear-gradient(180deg,#EEE8FF 0,#F3F6FC 420px) no-repeat,#F3F6FC;color:var(--blue-dark);-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;}

/* sidebar: Blue 800 with a soft vertical-streak glow at the top */
.sidebar{background:#03002C;}
.sb-top{background:#03002C;padding:26px 20px 14px;border-bottom:1px solid rgba(255,255,255,.08);}
.sb-top::before{left:0;right:0;top:0;bottom:auto;width:auto;height:150px;border-radius:0;background:var(--streaks);opacity:.9;}
.sb-top::after{content:"";position:absolute;left:0;right:0;top:0;height:150px;background:linear-gradient(180deg,transparent 0,#03002C 100%);pointer-events:none;}
.sb-eyebrow,.sb-title,.sb-search{position:relative;z-index:2;}
.sb-eyebrow{font-size:10px;font-weight:500;letter-spacing:2.4px;text-transform:uppercase;color:rgba(255,255,255,.78);margin-bottom:10px;}
.sb-title{font-size:26px;font-weight:300;letter-spacing:-.6px;line-height:1.05;color:#fff;}
.sb-search{border-radius:999px;padding:9px 16px;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2);}
.sb-item{border-radius:10px;font-weight:400;} .sb-item.active{background:rgba(161,251,249,.13);font-weight:600;box-shadow:inset 3px 0 0 #A1FBF9;}
.sb-item .ct{background:rgba(255,255,255,.14);}
.sb-gh{font-weight:600;letter-spacing:2px;} .sb-gh .dot{width:8px;height:8px;}
.sb-ov{font-weight:600;}

/* top bar */
.topbar{background:rgba(255,255,255,.82);border-bottom:1px solid var(--border);}
.crumb{color:var(--muted);} .crumb b{font-weight:600;color:var(--blue-dark);}
.btn-lite{border-radius:999px;border:1px solid var(--border);padding:7px 16px;font-weight:500;color:var(--blue-dark);background:#fff;}
.btn-lite:hover{background:var(--blue-dark);border-color:var(--blue-dark);color:#fff;}
.burger{border-radius:999px;border:1px solid var(--border);}

/* page header = website hero: dark indigo, vertical light streaks, thin large headline */
.ph{position:relative;overflow:hidden;background:#03002C;border:none;border-radius:20px;padding:44px 48px 38px;box-shadow:none;color:#fff;margin-bottom:18px;isolation:isolate;}
.ph-eyebrow{color:rgba(255,255,255,.82);font-weight:500;letter-spacing:2.4px;margin-bottom:14px;}
.ph .badge{background:rgba(255,255,255,.14) !important;color:#fff !important;border:1px solid rgba(255,255,255,.22);font-weight:600;letter-spacing:.3px;}
.ph .badge .sw{background:var(--chc,#A1FBF9) !important;width:8px;height:8px;}
.ph-title{font-size:40px;font-weight:300;letter-spacing:-1px;color:#fff;line-height:1.08;margin-bottom:12px;max-width:900px;}
.ph-blurb{color:rgba(255,255,255,.76);font-weight:300;font-size:14.5px;}
.ph-meta{color:rgba(255,255,255,.6);} .ph-meta b{color:#fff;font-weight:500;}

/* section nav chips -> pills */
.pnav{background:rgba(243,246,252,.92);backdrop-filter:blur(6px);}
.pnav a{border:1px solid var(--border);color:var(--blue-dark);font-weight:500;padding:6px 15px;}

/* ───────── helpers ───────── */
function esc(s){ if(s===null||s===undefined) return ""; return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function rgba(h,a){ var r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return "rgba("+r+","+g+","+b+","+a+")"; }
function badge(text,color){ if(!text) return ""; color=color||"#666666"; return '<span class="badge" style="background:'+rgba(color,.12)+';color:'+color+';"><span class="sw"></span>'+esc(text)+'</span>'; }
function statusPill(t){ if(!t) return ""; return badge(t, STATUS_COLOR[t]||"#666666"); }
function money(n){ return (n===null||n===undefined) ? "—" : "$"+Math.round(n).toLocaleString("en-US"); }
function money2(n){ return (n===null||n===undefined) ? "—" : "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
function cpl(s,l){ return (s!==null&&s!==undefined&&l>0) ? money(s/l) : "—"; }
function pct(n,d){ return (n===null||n===undefined) ? "—" : n.toFixed(d===undefined?1:d)+"%"; }
function ni(n){ return (n===null||n===undefined) ? "—" : Number(n).toLocaleString("en-US"); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,""); }
function parseDateAny(s){ s=(s||"").trim(); if(!s) return null; var iso=/^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(iso) return {y:+iso[1],m:+iso[2],d:+iso[3]}; var us=/^(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s); if(us) return {y:+us[3],m:+us[1],d:+us[2]}; return null; }
function dateShort(s){ var p=parseDateAny(s); return p ? p.y+"-"+String(p.m).padStart(2,"0")+"-"+String(p.d).padStart(2,"0") : ""; }
function monthKey(s){ var p=parseDateAny(s); return p ? p.y+"-"+String(p.m).padStart(2,"0") : null; }
var MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function monthLabel(k){ var a=k.split("-"); return MN[+a[1]-1]+" "+a[0]; }
function monthShort(k){ var a=k.split("-"); return MN[+a[1]-1]; }
function cleanComment(t){ if(!t) return ""; return String(t).replace(/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\s*\([A-Z]+\)\s*/,"").trim(); }
function specificCampaignValue(r){ if(r.campaign_group==="Quebec Bill 96"){ return "QB96:"+((r.bill96_campaigns&&r.bill96_campaigns[0])||"Original"); } return r.campaign_group; }
function sortedCount(rows, keyFn){ var m={}; rows.forEach(function(r){ var k=keyFn(r); if(k) m[k]=(m[k]||0)+1; }); return Object.keys(m).map(function(k){return [k,m[k]];}).sort(function(a,b){return b[1]-a[1];}); }

      kpi("kpi-b","Open rate",pct(s.open),ni(s.opens)+" unique opens")+kpi("kpi-t","Click rate (CTR)",pct(s.ctr),ni(s.clicks)+" unique clicks")+
      kpi("kpi-p","Click-to-open",pct(s.ctor),"of those who opened")+kpi("kpi-o","Opt-outs",ni(s.optouts),pct(s.optout,2)+" of delivered")+
    '</div>'+notes+

    wrap.appendChild(trig);
    var menu=document.createElement("div"); menu.className="custom-select-menu";
    function pick(v,l){ state.selects[s.key]=v; lab.textContent=s.label+": "+l; menu.querySelectorAll(".custom-select-option").forEach(function(o){ o.classList.toggle("selected", o.dataset.value===v); }); wrap.classList.remove("open"); config.onChange(state); }
    var all=document.createElement("div"); all.className="custom-select-option selected"; all.textContent=s.label+": All"; all.dataset.value=""; all.addEventListener("click", function(){ pick("","All"); }); menu.appendChild(all);
    s.options.forEach(function(o){ var el=document.createElement("div"); el.className="custom-select-option"; el.textContent=o.label; el.dataset.value=o.value; el.addEventListener("click", function(){ pick(o.value,o.label); }); menu.appendChild(el); });
    wrap.appendChild(menu); bar.appendChild(wrap);
  });
  var count=document.createElement("span"); count.className="filter-count"; bar.appendChild(count);
  container.appendChild(bar);
  return { state:state, countEl:count };
}
function renderTableCard(container, columns, rows, rowFn){
  var wrap=document.createElement("div"); wrap.className="table-card";
  var head='<thead><tr>'+columns.map(function(c){return "<th>"+esc(c)+"</th>";}).join("")+'</tr></thead>';
  wrap.innerHTML = rows.length ? '<table>'+head+'<tbody>'+rows.map(rowFn).join("")+'</tbody></table>' : '<table>'+head+'<tbody><tr class="empty-row"><td colspan="'+columns.length+'">No leads match these filters.</td></tr></tbody></table>';
  container.appendChild(wrap);
}

/* ───────── render ───────── */
function render(){
  clearCharts();
  monthSel.setLabel();
  var crumb = document.getElementById("crumb");
  if(S.view==="overview"){ crumb.innerHTML = '<b>Overview</b> · '+(S.src?CH[S.src].name+' only':'all campaigns'); renderOverview(); }
  else { var c = BY[S.view]; crumb.innerHTML = CH[c.ch].name+' › '+(c.parent?esc(BY[c.parent].short)+' › ':'')+'<b>'+esc(c.short)+'</b>'; renderCampaign(c); }
  markActive();
}
content.addEventListener("click", function(e){
  var tg = e.target.closest(".custom-select-trigger"); if(tg){ var w=tg.parentNode; document.querySelectorAll(".custom-select.open").forEach(function(o){ if(o!==w) o.classList.remove("open"); }); w.classList.toggle("open"); return; }
  var j = e.target.closest("[data-jump]"); if(j){ var t=document.getElementById(j.dataset.jump); if(t) t.scrollIntoView({behavior:"smooth",block:"start"}); return; }
  var sc = e.target.closest("[data-src]"); if(sc){ S.src = sc.dataset.src; go(undefined,undefined,true); return; }
  var mc = e.target.closest("[data-mon]"); if(mc){ go(undefined, mc.dataset.mon, true); return; }
  var g = e.target.closest("[data-go]"); if(g){ e.preventDefault(); go(g.dataset.go); }
});
window.addEventListener("hashchange", function(){ var prev=S.view+"|"+S.month; readHash(); if(S.view+"|"+S.month!==prev) { render(); window.scrollTo(0,0); } });

buildSidebar(); buildMonthSelect(); readHash(); render();
</script>
